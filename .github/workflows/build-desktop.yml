name: Build Desktop App

# Manual trigger, plus building automatically on version tags (v1.0.0 etc).
# Mac and Windows must each be built on their own OS -- PyInstaller freezes
# whatever platform it runs on, it cannot cross-compile.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/Projectify.spec

      - name: Smoke-test the frozen app
        run: |
          set +e
          dist/Projectify.app/Contents/MacOS/Projectify --selftest samples/sample_acme_grouped.pdf
          code=$?
          cat selftest.log 2>/dev/null
          exit $code

      - name: Zip the .app (preserves bundle structure/permissions)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Projectify.app dist/Projectify-mac.zip

      - name: Build .dmg
        run: |
          hdiutil create -volname Projectify -srcfolder dist/Projectify.app \
            -ov -format UDZO dist/Projectify-mac.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: projectify-mac
          path: |
            dist/Projectify-mac.zip
            dist/Projectify-mac.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/Projectify.spec

      # Frozen --windowed, so the exe is a GUI-subsystem binary: PowerShell does
      # NOT wait on it and would report success no matter what. Start-Process
      # -Wait -PassThru is what actually gets us the exit code.
      - name: Smoke-test the frozen app
        run: |
          $p = Start-Process -FilePath dist\Projectify\Projectify.exe `
                 -ArgumentList '--selftest','samples\sample_acme_grouped.pdf' -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Stage the README next to the app
        run: copy packaging\README-windows.txt dist\Projectify\README.txt

      # Archive the folder itself, not its contents: the exe will not run apart
      # from its _internal/ sibling, and a flat zip invites a tester to drag out
      # Projectify.exe on its own and get a broken app.
      - name: Zip the dist folder
        run: |
          Compress-Archive -Path dist/Projectify -DestinationPath dist/Projectify-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: projectify-windows
          path: dist/Projectify-windows.zip
