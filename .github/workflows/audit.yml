name: Audit

# Dependency freshness, not a gate on shipping. The PDF stack (pdfplumber pulls
# pdfminer.six and Pillow) has a real CVE history, and this app feeds it files that
# arrive from outside the company -- so the question is never "is it clean today"
# but "did something land since the last build".
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 9am UTC. A weekly nudge is the point; nothing here blocks a release.
    - cron: "0 9 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # Audits the resolved tree, so transitive deps (pdfminer.six, Pillow,
      # cryptography via keyring) are covered, not just the direct pins.
      - name: Audit runtime + desktop dependencies
        run: |
          pip-audit -r requirements.txt -r requirements-desktop.txt --strict

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The suite is offline by design (injectable transports, fake clients), so it
      # needs no credentials and touches no real Asana workspace.
      - name: Run tests
        run: python -m pytest -q
