version: 2
updates:
  # The PDF parsing stack is the one that matters here: it processes files from
  # outside the company, and pdfminer.six / Pillow have a CVE history.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; anything with a security advisory still comes
      # through on its own so it isn't buried in a batch.
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
